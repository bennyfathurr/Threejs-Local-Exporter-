<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Model Studio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- HEADER -->
      <header id="app-header"></header>

      <!-- WORKSPACE -->
      <main class="main-workspace" id="main-workspace">
        <!-- LEFT: SCENE HIERARCHY -->
        <aside class="sidebar-panel" id="sidebar-left">
          <div class="panel-header">
            <span>Scene Hierarchy</span>
            <div class="header-actions">
              <span id="scene-part-count" class="badge-tag">0 parts</span>
            </div>
          </div>
          <div class="tree-tools-bar">
            <div class="dropdown-wrapper" style="position:relative; flex:1;">
              <button class="btn btn-sm btn-primary" id="btn-tree-add-mesh" style="width:100%; justify-content:center; gap:6px; background: linear-gradient(135deg, #0ea5e9, #6366f1); border:none; font-weight:600;" title="Add new 3D mesh or group">
                <span>+ Add Object</span>
                <span style="font-size:9px;">▼</span>
              </button>
              <div class="mesh-create-dropdown" id="tree-mesh-dropdown" style="display:none; position:absolute; top:calc(100% + 4px); left:0; width:100%; min-width:200px; z-index:1000;"></div>
            </div>
            <button class="btn btn-sm" id="btn-tree-delete-selected" title="Delete selected object (Delete / Backspace)" style="color:var(--accent-rose); border-color: rgba(244, 63, 94, 0.35); padding: 0 9px;" disabled>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle;"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
          </div>
          <div class="tree-search-bar">
            <input
              type="text"
              id="tree-search-input"
              class="text-input"
              placeholder="Search components..."
            />
          </div>
          <div class="panel-content" id="scene-tree-container"></div>
        </aside>

        <!-- CENTER: 3D VIEWPORT -->
        <section class="viewport-area" id="viewport-center">
          <div class="canvas-container" id="canvas-container"></div>
          <div id="viewport-overlay"></div>
        </section>

        <!-- RIGHT: INSPECTOR & TRANSFORM -->
        <aside class="sidebar-panel right" id="sidebar-right">
          <div class="panel-header">
            <span>Inspector</span>
          </div>
          <div class="panel-content" id="inspector-container"></div>
        </aside>
      </main>

      <!-- BOTTOM: EXPORT DOCK -->
      <footer class="export-dock" id="export-dock"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
